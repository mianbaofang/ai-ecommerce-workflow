display_name: AI 电商公开市场研究与素材包
short_description: 从商品描述、公开链接或产品图出发，研究公开竞品并生成平台文案与素材规格。
recommended_companion_skills:
  - anysearch
  - multi-search-engine
optional_companion_tools:
  - Tavily
  - Brave Search
  - agentkey
  - agent-reach
  - humanizer-zh
  - seller analytics exports
  - marketplace screenshots
auto_install_policy:
  detect: true
  install_if_supported: false
  fallback: ask_user_or_use_host_public_search
auto_install_notes:
  - companion skills are resolved by the host Agent runtime
  - ask whether the user wants an optional public search provider at first use
  - never ask users to paste keys into chat or auto-install a provider
  - do not use crawler, bulk-scrape, login-only, or protected-page adapters
default_prompt: |
  【跑公开电商市场研究】
  产品描述 / 公开商品链接 / 产品图片:
  目标平台(可选):
  地区与语言(可选):
  需要素材包吗:否
